[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "earnings-watch"
version = "0.2.1"
description = "Verified issuer earnings calendars and results documents, through CLI and MCP"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "benjamin-di"}]
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1", "fastmcp==4.1.3", "pyyaml>=6,<7", "html2text>=2024.2", "tzdata>=2024.1", "signin-window[oidc]==0.4.17", "python-multipart>=0.0.20,<1"]

[project.scripts]
earnings-watch = "earnings_watch.cli:main"

[project.urls]
Homepage = "https://github.com/benjamin-di/earnings-watch"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25", "pytest-cov>=6", "ruff>=0.12,<1", "mypy>=1.18,<2", "types-PyYAML", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/earnings_watch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: requires model CLI and public network"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
