name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  released:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo exists=true >> "$GITHUB_OUTPUT"
          else
            echo exists=false >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: released
    if: needs.released.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make bootstrap
      - run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [serve, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        id: builder
        with:
          use: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        shell: bash
        run: |
          name=earnings-watch
          if [ '${{ matrix.target }}' = worker ]; then name=earnings-watch-worker; fi
          echo name="$name" >> "$GITHUB_OUTPUT"
          echo version="${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.builder.outputs.name }}
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ steps.metadata.outputs.name }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > 'digests/${{ steps.metadata.outputs.name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}
          path: digests/*
  smoke:
    needs: images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [earnings-watch, earnings-watch-worker]
        arch: [amd64, arm64]
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          digest="$(cat 'digests/${{ matrix.image }}')"
          docker run --rm --platform "linux/$ARCH" --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /data:uid=1000,gid=1000,mode=0700 --tmpfs /tmp --entrypoint sh "$IMAGE@$digest" -c 'earnings-watch init && earnings-watch doctor && earnings-watch upcoming --format json'
          if [ '${{ matrix.image }}' = earnings-watch-worker ]; then
            docker run --rm --platform "linux/$ARCH" --entrypoint claude "$IMAGE@$digest" --version
            docker run --rm --platform "linux/$ARCH" --entrypoint codex "$IMAGE@$digest" --version
          fi
  promote:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          for name in earnings-watch earnings-watch-worker; do
            image="ghcr.io/$OWNER/$name"
            if docker buildx imagetools inspect "$image:$version" >/dev/null 2>&1; then
              echo "Release version already exists; use a new version."
              exit 1
            fi
          done
          for name in earnings-watch earnings-watch-worker; do
            image="ghcr.io/$OWNER/$name"
            digest="$(cat "digests/$name")"
            docker buildx imagetools create --prefer-index=false --tag "$image:$version" --tag "$image:latest" "$image@$digest"
          done
  github-release:
    needs: [test, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          # The notes are the annotated tag's message: the version's CHANGELOG.md entry (publish-public).
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
          test -n "$object" || { echo "::error::$GITHUB_REF_NAME is not an annotated tag carrying release notes"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq .message > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" ./*
  pypi:
    needs: [released, github-release]
    if: >-
      always() && github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true' &&
      (needs.github-release.result == 'success' || needs.released.outputs.exists == 'true')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          uv tool run --from twine twine check --strict dist/*.whl dist/*.tar.gz
          uv venv /tmp/earnings-wheel-check
          uv pip install --python /tmp/earnings-wheel-check/bin/python dist/*.whl
          EARNINGS_WATCH_DATA_DIR=/tmp/earnings-release-state /tmp/earnings-wheel-check/bin/earnings-watch init
          EARNINGS_WATCH_DATA_DIR=/tmp/earnings-release-state /tmp/earnings-wheel-check/bin/earnings-watch doctor
          rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          attestations: true
          skip-existing: true
  registry:
    needs: [released, github-release, pypi]
    if: >-
      always() && github.ref_type == 'tag' && vars.MCP_REGISTRY_PUBLISH == 'true' &&
      (needs.github-release.result == 'success' || needs.released.outputs.exists == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Verify the publisher and the published package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          curl --fail --silent --show-error "https://pypi.org/pypi/earnings-watch/$version/json" -o /tmp/package.json
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir /tmp/earnings-registry-assets
          python3 - <<'PY'
          import json
          from pathlib import Path
          published = json.loads(Path('/tmp/package.json').read_text())
          expected = dict(line.split()[::-1] for line in Path('/tmp/earnings-registry-assets/SHA256SUMS').read_text().splitlines())
          actual = {item['filename']: item['digests']['sha256'] for item in published['urls']}
          if not expected or expected != actual:
              raise SystemExit('PyPI files differ from the accepted GitHub release')
          PY
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error -o "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
          jq --arg version "$version" '.version = $version | .packages[].version = $version' server.json > server-release.json
          mv server-release.json server.json
      - run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
